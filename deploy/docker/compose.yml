# deploy/docker/compose.yml — single-command rohy deploy.
#
# Quickstart:
#   cp deploy/docker/.env.example deploy/docker/.env
#   $EDITOR deploy/docker/.env                            # set ROHY_HOSTNAME
#   docker compose -p rohy -f deploy/docker/compose.yml up -d --build
#
# `-p rohy` is worth the keystrokes. Without it Compose names the project
# after the directory this file sits in — `docker` — so the volumes below
# become `docker_rohy-db` and `docker_rohy-hf-cache`, a namespace shared
# with any other stack you run from a folder called `docker/`. A leftover
# `docker_rohy-db` from an unrelated project gets reused by this one, and
# the symptom is a container that never turns healthy rather than an
# error naming the clash. Set it once in .env as COMPOSE_PROJECT_NAME=rohy
# if you prefer. Choose before the first run: changing it later points
# Compose at new, empty volumes and the database looks wiped (it isn't —
# see "Scope the compose project name" in docs/DEPLOY.md to migrate).
#
# Two services:
#   - rohy   : the Node app, persistent DB + HF cache volumes
#   - caddy  : reverse proxy with auto-TLS (Let's Encrypt for public hosts,
#              internal CA for LAN/dev). Adjust Caddyfile for plain HTTP.
#
# Drop the `caddy` service if you front rohy with your own nginx/Traefik/
# ingress controller. The rohy service exposes its HTTP listener on the
# bridge network; bind-publish 4000 to host if you want direct access.
#
# Persistence model:
#   rohy-db          : SQLite database. Survives `docker compose down`.
#                      Wiped only by `docker volume rm rohy-db`.
#   rohy-hf-cache    : Kokoro model + HF Transformers cache. ~330 MB
#                      after first TTS request. Re-downloads if wiped.
#   caddy-data       : Caddy's state (TLS certs from Let's Encrypt).
#                      LOSING THIS triggers fresh ACME challenges; rate-
#                      limit pain on Let's Encrypt's side.
#   caddy-config     : Caddy's config snapshots; safe to wipe.

services:
  rohy:
    build:
      context: ../..
      dockerfile: deploy/docker/Dockerfile
      args:
        # Set INCLUDE_PIPER=1 if you want Piper TTS bundled. Adds ~150 MB
        # to the image. Kokoro/Google/OpenAI work without it.
        INCLUDE_PIPER: "${INCLUDE_PIPER:-0}"
        # Pin a ladyna commit for reproducible builds. Default is main.
        LADYNA_GIT_REF: "${LADYNA_GIT_REF:-main}"
    image: rohy:latest
    container_name: rohy
    restart: unless-stopped
    environment:
      NODE_ENV: production
      PORT: 4000
      # FRONTEND_URL is the public origin browsers use. Behind Caddy with
      # auto-TLS, that's https://<your-hostname>/rohy.
      #
      # Left EMPTY on purpose: when it is empty, entrypoint.sh derives it as
      # https://$ROHY_HOSTNAME/rohy. Compose cannot do that itself —
      # `${FRONTEND_URL:-https://${ROHY_HOSTNAME:-localhost}/rohy}` nests one
      # interpolation inside another's default, which Compose rejects
      # outright ("invalid interpolation format … You may need to escape any
      # $ with another $"). Escaping to `$${ROHY_HOSTNAME:-localhost}` parses
      # but is WORSE: `$$` means a literal `$`, so the container would
      # receive the string "https://${ROHY_HOSTNAME:-localhost}/rohy"
      # verbatim and Node would use it, unexpanded, as an origin.
      FRONTEND_URL: "${FRONTEND_URL:-}"
      # Passed through so the entrypoint can do that derivation. Deliberately
      # NOT defaulted to localhost here: an empty value is how the entrypoint
      # tells "operator set no hostname" (a fatal misconfiguration in
      # production) from "operator chose localhost" (a valid local run).
      ROHY_HOSTNAME: "${ROHY_HOSTNAME:-}"
      # Trust the proxy chain so rate-limit + X-Forwarded-* work.
      ROHY_TRUST_PROXY: "${ROHY_TRUST_PROXY:-loopback}"
      # First-boot only: seed admin/admin123. REMOVE after first login.
      ALLOW_DEFAULT_USERS: "${ALLOW_DEFAULT_USERS:-}"
      # Recommended bootstrap: provision the first admin with your OWN password
      # (no well-known credential ever exists). Applied on first boot only, when
      # the users table is empty. Leave empty and the first account registered
      # through the UI claims the instance as admin instead.
      ROHY_ADMIN_USERNAME: "${ROHY_ADMIN_USERNAME:-}"
      ROHY_ADMIN_PASSWORD: "${ROHY_ADMIN_PASSWORD:-}"
      ROHY_ADMIN_EMAIL: "${ROHY_ADMIN_EMAIL:-}"
      # JWT_SECRET is auto-generated and persisted to the volume on first
      # boot. Override here only if you have an external secret manager.
      JWT_SECRET: "${JWT_SECRET:-}"
      # Local-browser emotion capture add-on (Oyon). Defaults to ON to
      # match the source-install path. Set OYON_ENABLED=0 in .env to opt
      # out — Settings shows a friendly disabled panel rather than 404s.
      OYON_ENABLED: "${OYON_ENABLED:-1}"
      # Optional API keys. Fine to leave empty — admin can set them in
      # the in-app Settings tab once logged in.
      OPENAI_API_KEY: "${OPENAI_API_KEY:-}"
      ANTHROPIC_API_KEY: "${ANTHROPIC_API_KEY:-}"
      GOOGLE_TTS_API_KEY: "${GOOGLE_TTS_API_KEY:-}"
    volumes:
      - rohy-db:/var/lib/rohy
      - rohy-hf-cache:/var/cache/rohy-hf
      # Uploaded images (body-map silhouettes). Without this they lived in
      # the container layer and vanished on every image redeploy.
      - rohy-uploads:/opt/rohy/public/uploads
    networks:
      - rohy-net
    # Healthcheck is also defined in the Dockerfile; redeclaring here so
    # `docker compose ps` shows the same status without inspecting the image.
    healthcheck:
      test: ["CMD", "curl", "-fsS", "http://127.0.0.1:4000/api/health"]
      interval: 30s
      timeout: 5s
      start_period: 30s
      retries: 3

  caddy:
    image: caddy:2-alpine
    container_name: rohy-caddy
    restart: unless-stopped
    depends_on:
      rohy:
        condition: service_healthy
    ports:
      - "${CADDY_HTTP_PORT:-80}:80"
      - "${CADDY_HTTPS_PORT:-443}:443"
    environment:
      ROHY_HOSTNAME: "${ROHY_HOSTNAME:-localhost}"
      # TLS mode is fixed in Caddyfile (internal CA / self-signed). To
      # switch to Let's Encrypt or plain HTTP, edit Caddyfile per the
      # instructions at the bottom of that file. There is no env-driven
      # selection — Caddyfile syntax can't conditionally apply directives.
    volumes:
      - ./Caddyfile:/etc/caddy/Caddyfile:ro
      - caddy-data:/data
      - caddy-config:/config
    networks:
      - rohy-net

volumes:
  rohy-db:
  rohy-hf-cache:
  rohy-uploads:
  caddy-data:
  caddy-config:

networks:
  rohy-net:
    driver: bridge
