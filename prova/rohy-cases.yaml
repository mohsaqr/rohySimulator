        with the room bar still reachable.
    - id: PLUGIN.ECG.02
      title: Ordering an ECG in Radiology does not send the learner to PACS
      kind: manual
      platforms: [any]
      severity_if_failed: minor
      steps: |-
        1. On a case with no authored ECG, order a 12-lead ECG from the Radiology catalogue.
        2. Look at the room bar and at the PACS worklist.
      expected: |-
        The ECG order does not make PACS treat it as an imaging study. The ECG room appears only for
        a case that actually has an authored recording.
      covers:
        - "rohy:chromium::plugin-rooms.spec.js › plugin content › a 12-lead ECG is not carried in the imaging archive"

- feature: PLUGIN.PATHOLOGY
  title: The pathology room
  products: [rohy]
  tier: extended
  cases:
    - id: PLUGIN.PATHOLOGY.01
      title: A slide opens and can be examined at magnification
      kind: manual
      platforms: [any]
      severity_if_failed: major
      steps: |-
        1. Start a case with an authored pathology slide and open the Pathology room.
        2. Zoom and pan across the slide.
      expected: |-
        The slide renders and stays sharp as it is magnified, and any gross photographs are reachable
        alongside it.

- feature: ROOM3D.BEDSIDE
  title: The bedside room
  products: [rohy]
  tier: optional
  cases:
    - id: ROOM3D.BEDSIDE.01
      title: The bedside reads as a ward, and every camera control is reachable
      kind: manual
      platforms: [any]
      severity_if_failed: minor
      steps: |-
        1. Open the Bedside room in a running case.
        2. Use every direction of the camera pan control, and each preset view.
        3. Click a body region and perform one examination from the wheel.
      expected: |-
        The ward, the bed, the patient and the bedside monitor are all drawn; no pan direction is
        blocked by another control sitting on top of it; and the examination produces the same
        finding the 2D Examination room would.
    - id: ROOM3D.BEDSIDE.02
      title: A machine that cannot render 3D is told so
      kind: manual
      platforms: [any]
      severity_if_failed: minor
      steps: |-
        1. Open the Bedside room on a machine or browser without working hardware 3D.
      expected: |-
        A plain message says the 3D view is unavailable and that the clinical controls remain usable,
        rather than a black canvas or a frozen tab.

# ───────────────────────────────────────────────────────────────────────────────
# Getting in, and staying in
# ───────────────────────────────────────────────────────────────────────────────

- feature: AUTH.LOGIN
  title: Logging in and out
  products: [rohy]
  tier: core
  cases:
    - id: AUTH.LOGIN.01
      title: A known account reaches its own workspace
      kind: automated
      platforms: [any]
      severity_if_failed: blocker
      steps: |-
        1. Log in as `student` / `student123` and look at what is offered.
        2. Log out, then log in as `admin` / `admin123`.
      expected: |-
        Both land in the workspace; the admin sees administrative controls that the student does not,
        and the student sees no administrative surface anywhere.
      covers: ["rohy:chromium::auth.spec.js › auth › admin login via UI*", "rohy:chromium::auth.spec.js › auth › student login via UI*"]
    - id: AUTH.LOGIN.02
      title: A wrong password is refused without saying which half was wrong
      kind: automated
      platforms: [any]
      severity_if_failed: blocker
      steps: |-
        1. Try to log in as `student` with the wrong password.
        2. Try to log in with a username that does not exist.
      expected: |-
        Both attempts are refused with the same kind of message shown on the form. Neither reveals
        whether the username exists, and neither lets the learner through.
      covers: ["rohy:chromium::auth.spec.js › auth › wrong password*"]
    - id: AUTH.LOGIN.03
      title: Logging out really ends the session
      kind: automated
      platforms: [any]
      severity_if_failed: blocker
      steps: |-
        1. Log in, then log out.
        2. Press the browser's Back button.
      expected: |-
        The login screen is shown and Back does not restore the previous workspace or any patient
        data.
      covers: ["rohy:chromium::auth.spec.js › auth › logout button*"]

- feature: AUTH.SESSION
  title: Staying logged in
  products: [rohy]
  tier: core
  cases:
    - id: AUTH.SESSION.01
      title: An expired session returns the user to the login screen
      kind: automated
      platforms: [any]
      severity_if_failed: major
      steps: |-
        1. Log in, then let the session expire (or have an admin revoke it).
        2. Reload the page.
      expected: |-
        The app returns to the login screen rather than showing a half-loaded workspace or an error
        page.
      covers: ["rohy:chromium::auth.spec.js › auth › expired token*"]
    - id: AUTH.SESSION.02
      title: The same case in a second tab warns instead of corrupting
      kind: automated
      platforms: [any]
      severity_if_failed: major
      steps: |-
        1. Open a running case in one tab.
        2. Open the same case in a second tab of the same browser.
        3. Return to the first tab.
      expected: |-
        The first tab shows a plain warning that the case is open elsewhere, and stays usable. Neither
        tab silently loses the conversation.
      covers: ["rohy:chromium::multi-tab.spec.js › multi-tab session handling › *"]
    - id: AUTH.SESSION.03
      title: Closing the browser does not lose the case
      kind: automated
      platforms: [any]
      severity_if_failed: major
      steps: |-
        1. Start a case and hold a short conversation with the patient.
        2. Close the browser entirely, reopen it and return to the site.
      expected: |-
        The user is still logged in and the case is still running, with the conversation and the
        elapsed session time intact.
      covers:
        - "rohy:chromium::gate-rooms.spec.js › coming back to a case › closing the browser and coming back keeps the learner in their case"

- feature: AUTH.PASSWORD
  title: Password rules
  products: [rohy]
  tier: core
  cases:
    - id: AUTH.PASSWORD.01
      title: A password the form accepts is a password the server accepts
      kind: both
      platforms: [any]
      severity_if_failed: major
      steps: |-
        1. As an admin, create a user and try the password `short1A`.
        2. Try `alllowercase1`.
        3. Try one that satisfies the stated rules — at least eight characters with an upper-case
           letter, a lower-case letter and a digit.
      expected: |-
        The form states the rule and refuses the first two before submitting; the third is accepted
        and the new user can log in with it. The form never accepts something the save then rejects.
      covers:
        - "rohy:chromium::gate-core.spec.js › the password the form accepts is the password the server accepts › the client mirror predicts the server, password by password"

