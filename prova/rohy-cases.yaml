      covers:
        - "rohy:chromium::alarms.spec.js › alarms + notifications (Phase 5) › PUT /api/alarms/:id/acknowledge returns 200 + acknowledged_at"
        - "rohy:chromium::alarms.spec.js › alarms + notifications (Phase 5) › repeat ack is idempotent and returns already_acknowledged:true"
        - "rohy:chromium::alarms.spec.js › alarms + notifications (Phase 5) › student cannot ack an alarm bound to another user's session"
        - "rohy:chromium::alarms.spec.js › alarms + notifications (Phase 5) › student cannot read another user's alarm config"

