      covers:
        - "rohy:chromium::a11y-floor.spec.js › accessibility floor › the login form can be completed and submitted by keyboard alone"
    - id: A11Y.KEYBOARD.02
      title: Every control says what it is
      kind: manual
      platforms: [any]
      severity_if_failed: minor
      steps: |-
        1. Tab through the patient room, the ordering catalogue and the settings forms.
      expected: |-
        Every field has a visible label, and every icon-only button announces its purpose on focus or
        hover rather than being an unexplained symbol.
      covers:
        - "rohy:chromium::a11y-floor.spec.js › accessibility floor › every form control on the login screen has an accessible name"
        - "rohy:chromium::a11y-floor.spec.js › accessibility floor › every button on the login screen has an accessible name"

- feature: NOTIFY.CENTER
  title: Notifications
  products: [rohy]
  tier: extended
  cases:
    - id: NOTIFY.CENTER.01
      title: Muting a source silences it everywhere but still records it
      kind: manual
      platforms: [any]
      severity_if_failed: minor
      steps: |-
        1. Open Settings ▸ Notifications and mute one source.
        2. Provoke a notification from that source.
        3. Open the notification history.
      expected: |-
        Nothing pops up or sounds for the muted source, but the event is still listed in the history —
        "be quieter" does not mean "stop recording".

# ───────────────────────────────────────────────────────────────────────────────
# Educator and admin
# ───────────────────────────────────────────────────────────────────────────────

- feature: AUTHOR.CASE
  title: Authoring a case
  products: [rohy]
  tier: extended
  cases:
    - id: AUTHOR.CASE.01
      title: An educator can build a runnable case from start to finish
      kind: manual
      platforms: [any]
      severity_if_failed: blocker
      steps: |-
        1. As an educator, create a new case and work through every step of the wizard, filling in
           demographics, the story, starting vital signs and at least one expected treatment.
        2. Save the case.
        3. Log in as a student and run it.
      expected: |-
        The wizard can be completed without any step blocking on something it never asked for, and the
        saved case starts, talks and behaves as authored when the student runs it.
    - id: AUTHOR.CASE.02
      title: A student never sees the authoring title
      kind: manual
      platforms: [any]
      severity_if_failed: blocker
      steps: |-
        1. Author a case whose title names the diagnosis, for example "Inferior STEMI".
        2. Run it as a student and read every room header and the case list entry.
      expected: |-
        Nowhere in the student's view does the diagnosis-bearing title appear — not in the case list,
        not in a room header and not in a browser tab title.
    - id: AUTHOR.CASE.03
      title: Editing a case does not disturb a session already running
      kind: manual
      platforms: [any]
      severity_if_failed: major
      steps: |-
        1. Have a student start a case and leave it running.
        2. As an educator, change that case's starting vital signs and scenario, and save.
        3. Return to the student's running session.
      expected: |-
        The running session is unchanged and continues on the values it started with; the edit applies
        to the next session, not to one already in progress.
    - id: AUTHOR.CASE.04
      title: A saved case can be taken back to an earlier version
      kind: manual
      platforms: [any]
      severity_if_failed: major
      steps: |-
        1. Change and save a case twice.
        2. Restore the earlier version from the case's history.
      expected: |-
        The earlier content comes back in full, and running the case afterwards uses the restored
        content.

- feature: AUTHOR.VISIBILITY
  title: What a case exposes
  products: [rohy]
  tier: extended
  cases:
    - id: AUTHOR.VISIBILITY.01
      title: Hiding an investigation is an explicit act
      kind: both
      platforms: [any]
      severity_if_failed: major
      steps: |-
        1. As an educator, add two specific labs to a case but hide none.
        2. Run the case as a student and open the Laboratory catalogue.
      expected: |-
        The full catalogue is offered, with the case's own additions among it. Adding an expected test
        does not quietly hide everything else, because that would hand the student the answer.
      covers:
        - "rohy:chromium::clinical-guardrails.spec.js › clinical guardrails › the laboratory catalogue stays full, whatever the case expects"
        - "rohy:chromium::clinical-guardrails.spec.js › clinical guardrails › the radiology catalogue stays full too"

- feature: AUTHOR.PLUGINS
  title: Authoring plugin content
  products: [rohy]
  tier: extended
  cases:
    - id: AUTHOR.PLUGINS.01
      title: An educator attaches an ECG and the room appears for the student
      kind: manual
      platforms: [any]
      severity_if_failed: major
      steps: |-
        1. As an educator, open a case's plugin step and add a 12-lead ECG recording in the editor.
        2. Save and leave the editor.
        3. Run the case as a student.
      expected: |-
        The ECG room is offered in the student's room bar and opens the recording the educator chose.
    - id: AUTHOR.PLUGINS.02
      title: A plugin editor that cannot accept content says why
      kind: manual
      platforms: [any]
      severity_if_failed: minor
      steps: |-
        1. In the pathology editor, try to add a slide from the bundled starter content.
      expected: |-
        Either the slide is added and the Pathology room then appears for a student, or the editor
        explains in plain language why that slide cannot be used. A silent failure or a raw technical
        error is a defect.

- feature: COURSE.COHORT
  title: Courses and enrolment
  products: [rohy]
  tier: extended
  cases:
    - id: COURSE.COHORT.01
      title: A student sees their course's cases and no others
      kind: manual
      platforms: [any]
      severity_if_failed: major
      steps: |-
        1. As an educator, create a course, attach two cases to it and enrol one student.
        2. Log in as that student and open the case list.
        3. Log in as a student who is not enrolled.
      expected: |-
        The enrolled student is offered the course and its cases; the unenrolled student is not shown
        that course's content.

- feature: PERSONA.AGENTS
  title: Personas and supporting agents
  products: [rohy]
  tier: extended
  cases:
    - id: PERSONA.AGENTS.01
      title: An edited persona reaches the next session
      kind: manual
      platforms: [any]
      severity_if_failed: major
      steps: |-
        1. As an admin, edit a patient persona so its manner is distinctly different, and save.
        2. Start a fresh session on a case using that persona and ask two questions.
      expected: |-
        The new manner is audible in the answers from the first reply, without needing a restart of
        the application.
    - id: PERSONA.AGENTS.02
      title: What an agent knows is set per agent, per case, and comes back as it was left
      kind: automated
      platforms: [any]
      severity_if_failed: major
      steps: |-
        1. As an admin, open a case, go to the Agents step and choose Case overrides on a nurse.
        2. Change what the agent knows, save, leave the panel and come back to it.
      expected: |-
        The block appears for a nurse, a consultant and a family member, and NOT for an on-call
        specialist (whose disclosure gate is its own control) or the patient (whose prompt is built
        by a different path). It shows the value stored for this case rather than the shipped
        default, and the value survives a save and a cold reopen — read back from the server, not
        redrawn from the panel's own state. Choosing "knows nothing" clears the encounter-record
        toggle, because an agent told nothing about the patient must not also hold the list of
        everything that was ordered. Keys the panel does not edit survive the save.
      covers:
        - "rohy:chromium::agent-knowledge.spec.js › the knowledge block in the case editor › *"
    - id: PERSONA.AGENTS.03
      title: The chosen scope decides what reaches the model, and the browser cannot widen it
      kind: automated
      platforms: [any]
      severity_if_failed: blocker
      steps: |-
        1. Set an agent's knowledge to each scope in turn and speak to it in a session.
        2. Read the system prompt the server sent upstream, not the one the browser posted.
      expected: |-
        At the whole-chart scope the client's situation is used as before. At "knows nothing" the
        client's situation is DROPPED entirely — no case context, no history, no diagnosis, no
        vitals — and replaced by a server-built block saying the agent was told nothing. At the
        handover scope the prompt carries the patient's identity, the reason for presentation and
        the last observations the SERVER read from session_vitals, not the values the browser sent.
        The role anchor and the authored persona still lead every prompt, and an on-call specialist
        is still briefed on findings and never on the patient.
      covers:
        - "rohy:chromium::agent-knowledge.spec.js › the compiled prompt, as the model receives it › *"
    - id: PERSONA.AGENTS.04
      title: A knowledge setting the server cannot honour is refused, not stored
      kind: automated
      platforms: [any]
      severity_if_failed: major
      steps: |-
        1. Send a case-agent update carrying an unknown scope, and another carrying an unknown field.
        2. Clear the override from an agent that has no stored knowledge of its own.
      expected: |-
        Both bad updates are refused with `invalid_knowledge` and NOTHING is stored — a setting that
        is kept but never honoured is worse than one that is rejected. An agent with no stored
        knowledge keeps the behaviour its legacy `context_filter` column gave it, so an install that
        has not been migrated is never silently narrowed by a release.
      covers:
        - "rohy:chromium::agent-knowledge.spec.js › the server refuses what it cannot honour › *"
    - id: PERSONA.AGENTS.05
      title: An unbriefed colleague admits what it was not told instead of inventing it
      kind: manual
      platforms: [any]
      severity_if_failed: major
      steps: |-
        1. Set the on-call consultant on a case to know NOTHING, and start a session as a learner.
        2. Page the consultant and tell it only "sixty-five year old with chest pain" — no age
           confirmation, no history, no observations, no results.
        3. Ask it what it thinks, then ask it directly about something you never mentioned (the
           patient's allergies, or what the troponin showed).
      expected: |-
        It asks for what it was not given rather than proceeding, and when asked about the allergy
        or the troponin it says plainly that it has not been told, rather than producing a plausible
        value. It must not describe symptoms, a history or a result that you did not say out loud,
        and it must not repeat a detail back as though it already had it.

        This is the half no automated check can make. The suite proves the prompt SAYS the agent
        knows nothing; only a person can judge whether the model honours that. Run it against the
        smaller model used in voice mode as well as the default — back-filling is likeliest there.

