- feature: I18N.UI
  title: Interface language
  products: [rohy]
  tier: extended
  cases:
    - id: I18N.UI.01
      title: Changing language translates the whole workspace
      kind: manual
      platforms: [any]
      severity_if_failed: major
      steps: |-
        1. Change the interface language to Finnish from the picker on the login screen.
        2. Log in and walk through the patient, examination, laboratory and debrief rooms.
      expected: |-
        Every label, button and message in those rooms is in Finnish. Any English left behind is a
        defect worth reporting with a screenshot naming the screen.
      covers:
        - "rohy:chromium::i18n-pass.spec.js › localisation › choosing a language changes the login screen"
        - "rohy:chromium::i18n-pass.spec.js › localisation › the login screen has no hardcoded English"
        - "rohy:chromium::i18n-pass.spec.js › localisation › the login screen offers every shipped language"
    - id: I18N.UI.02
      title: A long language does not break the layout
      kind: manual
      platforms: [any]
      severity_if_failed: minor
      steps: |-
        1. With the interface in German or Finnish, visit each room and open the orders drawer and
           the monitor's controls.
      expected: |-
        No label is clipped, truncated mid-word or pushed outside its button, and nothing overlaps.
    - id: I18N.UI.03
      title: The language choice survives a return visit
      kind: manual
      platforms: [any]
      severity_if_failed: minor
      steps: |-
        1. Set the interface to Swedish, log out and close the tab.
        2. Return to the site.
      expected: |-
        The login screen is still in Swedish — the choice belongs to the person, not to the session.
      covers:
        - "rohy:chromium::i18n-pass.spec.js › localisation › a language choice survives a reload"

- feature: I18N.CASE
  title: Case language
  products: [rohy]
  tier: core
  cases:
    - id: I18N.CASE.01
      title: The case's language is independent of the interface language
      kind: both
      platforms: [any]
      severity_if_failed: major
      steps: |-
        1. Set the interface to English.
        2. Open the case list and look at how each case's language is shown.
        3. Start the Italian case and talk to the patient.
      expected: |-
        Each case advertises its own language in the list; the Italian patient speaks Italian while
        every room label around them stays in English.

# ───────────────────────────────────────────────────────────────────────────────
# Voice — needs engines and hardware, so these are environment-dependent
# ───────────────────────────────────────────────────────────────────────────────
      covers:
        - "rohy:chromium::gate-core.spec.js › a case carries its own language › each case advertises its own language, whatever the interface is set to"

- feature: VOICE.OUT
  title: The patient speaking
  products: [rohy]
  tier: optional
  cases:
    - id: VOICE.OUT.01
      title: The patient's reply is spoken in the configured voice
      kind: manual
      platforms: [chrome, edge, firefox, safari]
      severity_if_failed: major
      steps: |-
        1. On a case with a configured voice, ask the patient a question.
        2. Listen to the reply.
      expected: |-
        The reply is spoken aloud, the audio matches the written text, and the voice suits the
        patient as configured. Playback is not clipped at either end.
    - id: VOICE.OUT.02
      title: The debrief tutor does not borrow the patient's voice
      kind: manual
      platforms: [any]
      severity_if_failed: major
      steps: |-
        1. Hear the patient speak in a case with a distinctive voice.
        2. End the case and start the debrief.
      expected: |-
        The discussant speaks with its own clearly different voice, not the patient's.

- feature: VOICE.IN
  title: Speaking to the patient
  products: [rohy]
  tier: optional
  cases:
    - id: VOICE.IN.01
      title: A spoken question reaches the patient
      kind: manual
      platforms: [chrome, edge, firefox, safari]
      severity_if_failed: major
      steps: |-
        1. Turn on voice mode in the patient room and grant microphone access.
        2. Press to talk, ask "Where is the pain?", and stop.
      expected: |-
        What was said appears as the learner's turn, it is sent without a second confirmation, and the
        patient answers it. The control shows which state it is in — listening, thinking or speaking —
        at every moment.

- feature: VOICE.SOVEREIGN
  title: A configured voice is literal
  products: [rohy]
  tier: optional
  cases:
    - id: VOICE.SOVEREIGN.01
      title: A voice whose engine is unavailable fails honestly
      kind: both
      platforms: [any]
      severity_if_failed: blocker
      steps: |-
        1. Configure a case's patient with a voice from one engine.
        2. Have an admin turn that engine off or make it unreachable.
        3. Ask the patient a question.
      expected: |-
        The failure is reported plainly. The patient is never given a different voice as a silent
        substitute — a wrong voice is worse than a stated error.
      covers: ["rohy:chromium::voice-runtime.spec.js › voice runtime contract › 4. voice engine routing*"]

