# Rohy — the manual half of the test battery.
#
# Import:  curl -X POST "$PROVA_URL/api/v1/catalog/import" \
#            -H "Authorization: Bearer $PROVA_ADMIN_TOKEN" \
#            -H 'Content-Type: application/yaml' --data-binary @prova/rohy-cases.yaml
#
# These are the checks only a person can make: whether the AI patient is clinically plausible,
# whether a room reads as a room, whether a debrief is fair. The machine half lives in tests/e2e
# and reports into the same Prova product; where a case is also covered by automation it names the
# check keys under `covers:`.
#
# Conventions this file must keep (enforced by Prova, server/lib/catalog.mjs):
#   - feature id  AREA.NAME, upper case, no underscores
#   - case id     <FEATURE>.NN, at least two digits, and a case id NEVER moves between features
#   - kind        manual | automated | both        (NOT "auto")
#   - tier        core | extended | optional
#   - covers      "rohy:<suite>::<label>", "*" only as the final character
#   - block-style YAML only; the reader rejects flow mappings like {a: b}
#
# Tier means something specific here. The gate rule is core_cases_on_platforms over
# chrome+edge+firefox+safari, so a `core` case with an explicit browser list must be passed by a
# person on ALL FOUR browsers before a build can ship. `platforms: [any]` is satisfied by one pass,
# and is the default. Explicit browser lists are reserved for cases where the browser engine IS the
# thing under test, and those are `extended` so a four-browser sweep is a decision, not a block.
#
# Tester preconditions, once, for the whole catalogue:
#   - A disposable instance. NEVER point this battery at the production database.
#   - Seeded accounts on a fresh install: admin / admin123 and student / student123.
#   - Seeded cases: an English STEMI case, plus natively authored de, es and it cases.
#   - On a first run for a role the onboarding tour covers the room navigator — skip it first.
#   - Build under test should be the `advanced` channel, because that is what production serves.

# ───────────────────────────────────────────────────────────────────────────────
# The learner's clinical spine
# ───────────────────────────────────────────────────────────────────────────────

- feature: BOOT.HEALTH
  title: The build boots and knows what it is
  products: [rohy]
  tier: core
  cases:
    - id: BOOT.HEALTH.01
      title: Health answers with the version this build actually is
      kind: automated
      platforms: [any]
      severity_if_failed: blocker
      steps: |-
        1. Request `/api/health` on the instance under test.
      expected: |-
        200 with a `version` that matches the build being tested. This is what ties a manual run and
        an automated run to the same build in Prova — if they disagree, the two halves of the battery
        land on different builds and the coverage matrix quietly splits in two.
      covers:
        - "rohy:chromium::boot-health.spec.js › boot and health › health answers 200 with the version this build actually is"
        - "rohy:chromium::boot-health.spec.js › boot and health › health reports an uptime and a start time"
    - id: BOOT.HEALTH.02
      title: Readiness reports the database and the applied migrations
      kind: automated
      platforms: [any]
      severity_if_failed: blocker
      steps: |-
        1. Request `/api/ready` — note the path is `/api/ready`, NOT `/api/health/ready`.
      expected: |-
        200 when healthy (or 503 when a dependency is unhappy), naming each probe: `db`, `migrations`,
        `ingest` and `timestamps`. A healthy build reports the database answering and the migration
        it has reached.
      covers:
        - "rohy:chromium::boot-health.spec.js › boot and health › readiness reports the database and the applied migrations"
    - id: BOOT.HEALTH.03
      title: The SPA shell is served rather than an empty directory
      kind: automated
      platforms: [any]
      severity_if_failed: blocker
      steps: |-
        1. Request `/` and check the document mounts the application.
      expected: |-
        200 with the app's root element present and its scripts referenced at a path the server
        actually serves. A bundle built for one base path and served at another 404s every asset:
        the shell loads, the app never mounts, and every downstream check fails as "element not
        found".
      covers:
        - "rohy:chromium::boot-health.spec.js › boot and health › the SPA shell is served, not an empty static directory"

- feature: SESSION.START
  title: Starting and resuming a case
  products: [rohy]
  tier: core
  cases:
    - id: SESSION.START.01
      title: Loading a case puts the learner in a live consultation
      kind: both
      platforms: [any]
      severity_if_failed: blocker
      steps: |-
        1. Log in as `student`.
        2. Note what the patient pane says before any case is chosen.
        3. Open the top-bar menu and choose Settings; it opens on the **Select Case** tab.
        4. Choose the English chest-pain (STEMI) case.
      expected: |-
        Before the case the pane reads "No Case Selected."; after choosing it the consultation is
        already running with no separate Start button — the room bar appears along the bottom, the
        monitor is tracing, and if the case has a greeting the patient has already spoken.
      covers: ["rohy:chromium::case-lifecycle.spec.js › case lifecycle › 1. load case*"]
    - id: SESSION.START.02
      title: A reloaded page comes back to the same moment, not the beginning
      kind: both
      platforms: [any]
      severity_if_failed: major
      steps: |-
        1. In a running case, go to the Examination room and perform one examination.
        2. Read the "Session time" clock on the patient room's monitor.
        3. Press F5 to reload the page.
      expected: |-
        The learner lands back in the Examination room (not the patient room), the session clock
        continues from where it was rather than restarting at 0:00, and the earlier conversation and
        the examination log are still there.
      covers:
        - "rohy:chromium::gate-rooms.spec.js › coming back to a case › a reload comes back to the same room, with the clock carrying on"

- feature: NAV.ROOMS
  title: The room navigator
  products: [rohy]
  tier: core
  cases:
    - id: NAV.ROOMS.01
      title: Every room in the bar opens and the case stays live
      kind: both
      platforms: [any]
      severity_if_failed: blocker
      steps: |-
        1. Start the English STEMI case as `student` and skip the onboarding tour.
        2. Click each room button in the bottom bar in turn, left to right.
        3. Return to Patient.
      expected: |-
        Every button opens its room, the active one is visibly marked, nothing is hidden behind the
        bar or off the bottom of the screen, and back in the patient room the conversation and the
        session clock have carried on rather than restarting.
      covers:
        - "rohy:chromium::gate-rooms.spec.js › the room bar › every room in the bar opens, and the case is still live afterwards"

    - id: NAV.ROOMS.02
      title: Ready results are advertised on the Laboratory and Radiology buttons
      kind: manual
      platforms: [any]
      severity_if_failed: minor
      steps: |-
        1. In the Laboratory room order any test with **Order instantly**.
        2. Go to the Patient room and wait up to fifteen seconds without opening Laboratory.
        3. Open Laboratory and click the ready result.
      expected: |-
        A green count badge appears on the Laboratory button while the result is unread and
        disappears once it has been opened. No badge ever appears on a room that has no results.
    - id: NAV.ROOMS.03
      title: Visiting the Consultant mid-case does not end the case
      kind: automated
      platforms: [any]
      severity_if_failed: major
      steps: |-
        1. In a running case, click **Consultant** in the room bar.
        2. Click **Back to patient**.
      expected: |-
        The case is still live: the monitor is tracing, the session clock is still counting, the
        "End & Debrief" button is still offered, and no "case ended" state has appeared.
      covers:
        - "rohy:chromium::gate-rooms.spec.js › the room bar › visiting the Consultant mid-case does not end the case"

- feature: CASE.INTERVIEW
  title: Interviewing the virtual patient
  products: [rohy]
  tier: core
  cases:
    - id: CASE.INTERVIEW.01
      title: The patient answers an open question in character
      kind: both
      platforms: [any]
      severity_if_failed: blocker
      steps: |-
        1. Start the English chest-pain case.
        2. In the composer, ask "What brings you in today?" and send it.
      expected: |-
        Within a few seconds a reply arrives in the patient's own voice, consistent with the
        presenting complaint. It contains no system or instruction text, does not read as a textbook
        entry, and does not announce a diagnosis the patient could not know.
      covers: ["rohy:chromium::case-lifecycle.spec.js › case lifecycle › 2. patient speaks*"]
    - id: CASE.INTERVIEW.02
      title: The patient stays in their own language whatever the learner writes
      kind: manual
      platforms: [any]
      severity_if_failed: major
      steps: |-
        1. Keep the interface in English and start the natively authored **German** case.
        2. Ask the patient a question in English.
      expected: |-
        The patient answers in German. The interface around it stays in English — the case's language
        is a property of the case, not of the learner's interface.
    - id: CASE.INTERVIEW.03
      title: The patient does not hand over the diagnosis when asked outright
      kind: manual
      platforms: [any]
      severity_if_failed: major
      steps: |-
        1. In the chest-pain case, ask the patient "What is wrong with me? What is the diagnosis?"
      expected: |-
        The patient responds as a person would — describing what they feel or what they have been
        told — without naming the underlying diagnosis or quoting the case's teaching material.
    - id: CASE.INTERVIEW.04
      title: A second question while the patient is mid-answer is refused clearly
      kind: manual
      platforms: [any]
      severity_if_failed: minor
      steps: |-
        1. Send a question to the patient.
        2. While the reply is still being composed, try to send a second message.
      expected: |-
        The composer is disabled and shows a waiting state while the patient answers; attempting a
        second send produces a plain message saying the patient is still answering, and the first
        answer still arrives normally.
    - id: CASE.INTERVIEW.05
      title: A failed reply is reported honestly, not swallowed
      kind: manual
      platforms: [any]
      severity_if_failed: major
      steps: |-
        1. Have an admin point the platform model at an unreachable provider (Settings ▸ Platform ▸ AI).
        2. As a learner, send a message to the patient.
      expected: |-
        The chat shows a visible error for that turn saying the reply could not be obtained. The
        message is not silently dropped, no fabricated patient answer appears, and the app stays
        usable.

- feature: CASE.EXAM
  title: Physical examination
  products: [rohy]
  tier: core
  cases:
    - id: CASE.EXAM.01
      title: Examining a region returns a finding and records it in the log
      kind: both
      platforms: [any]
      severity_if_failed: blocker
      steps: |-
        1. Open the Examination room.
        2. Click the chest on the body map.
        3. Choose **Auscultation**.
      expected: |-
        A finding appears for that region and technique, badged either Normal or Abnormal, and a row
        naming the region and the technique is added to the Examination Log with the counters
        updated.
      covers: ["rohy:chromium::case-lifecycle.spec.js › case lifecycle › 5. exam findings*"]
    - id: CASE.EXAM.02
      title: Repeating the same examination does not duplicate the log
      kind: automated
      platforms: [any]
      severity_if_failed: minor
      steps: |-
        1. Perform the same region-and-technique examination a second time.
        2. Read the Examination Log and its "examinations performed" count.
      expected: |-
        The technique is marked as already done, the same finding is shown again, and the log still
        holds one row for that region-and-technique pair rather than two.
      covers:
        - "rohy:chromium::gate-core.spec.js › an examination recorded twice is one examination › a repeated region-and-technique yields one row and one increment"
        - "rohy:chromium::gate-exam.spec.js › repeating an examination › the same technique twice is marked done, shown again, and logged once"

    - id: CASE.EXAM.03
      title: The body map offers both aspects and both figures
      kind: both
      platforms: [any]
      severity_if_failed: minor
      steps: |-
        1. In the Examination room, switch between Anterior and Posterior.
        2. Switch the figure between the male and female silhouette.
        3. Use the **General** and **Neuro** shortcuts.
      expected: |-
        Each toggle redraws the body map with regions that are clickable in the new view, and the
        shortcuts open their grouped examinations. No control leaves the pane blank.
      covers:
        - "rohy:chromium::gate-exam.spec.js › the body map › each aspect and each shortcut redraws a map that can still be worked"

- feature: CASE.LABS
  title: Ordering laboratory tests
  products: [rohy]
  tier: core
  cases:
    - id: CASE.LABS.01
      title: A lab order waits its turnaround and then produces a report
      kind: both
      platforms: [any]
      severity_if_failed: blocker
      steps: |-
        1. Open the Laboratory room and search for troponin.
        2. Tick it and press the order button.
        3. Watch the worklist on the right without leaving the room.
        4. When the row becomes ready, click it.
      expected: |-
        The order appears under Pending with a visibly decreasing countdown, moves to Ready by itself,
        and clicking it opens a readable report in the centre column which then counts as Viewed.
      covers: ["rohy:chromium::case-lifecycle.spec.js › case lifecycle › 4. labs ordered*"]
    - id: CASE.LABS.02
      title: The catalogue offers the full list, not only what the case expects
      kind: both
      platforms: [any]
      severity_if_failed: major
      steps: |-
        1. Open the Laboratory room as a learner on the chest-pain case.
        2. Search for several tests that are clinically irrelevant to chest pain.
      expected: |-
        The irrelevant tests are all present and orderable. The catalogue is not narrowed to the
        case's expected work-up — narrowing it would tell the learner the answer.
      covers:
        - "rohy:chromium::clinical-guardrails.spec.js › clinical guardrails › the laboratory catalogue stays full, whatever the case expects"
    - id: CASE.LABS.03
      title: Order instantly skips the wait
      kind: manual
      platforms: [any]
      severity_if_failed: minor
      steps: |-
        1. Tick a test in the Laboratory catalogue.
        2. Press **Order instantly** rather than the ordinary order button.
      expected: |-
        The result is in the worklist as Ready straight away with no countdown, and the confirmation
        says the order was instant.

- feature: CASE.IMAGING
  title: Ordering imaging
  products: [rohy]
  tier: core
  cases:
    - id: CASE.IMAGING.01
      title: A radiology order produces a report with findings and an impression
      kind: manual
      platforms: [any]
      severity_if_failed: blocker
      steps: |-
        1. Open the Radiology room and order a chest X-ray.
        2. Open it from the worklist when ready.
      expected: |-
        A structured report opens showing at least the clinical indication, findings and an
        impression, laid out as a report rather than as raw data.
    - id: CASE.IMAGING.02
      title: Ordering imaging opens the PACS room
      kind: both
      platforms: [any]
      severity_if_failed: major
      steps: |-
        1. On a case with no PACS button in the room bar, order any imaging study in Radiology.
        2. Look at the room bar again.
        3. Open the radiology report and use **View images in PACS**.
      expected: |-
        The PACS room appears in the bar once an imaging study has been ordered, and the report's
        PACS link opens that room on the study.
      covers:
        - "rohy:chromium::gate-core.spec.js › orders honour what the learner asked for › an imaging order is what makes a study exist for the PACS room"

- feature: CASE.TREAT
  title: Giving a treatment
  products: [rohy]
  tier: core
  cases:
    - id: CASE.TREAT.01
      title: An administered drug visibly changes the patient
      kind: manual
      platforms: [any]
      severity_if_failed: blocker
      steps: |-
        1. Open the orders drawer from the patient room and choose **Treatments**.
        2. Order a medication with a dose and an IV route.
        3. Press **Administer** on the resulting order.
        4. Watch the vitals column for the next two to three minutes.
      expected: |-
        The order moves to an administered state, an "Active treatments" panel appears listing the
        drug with its effect on the vital signs, and the numbers on the monitor move in the direction
        that panel claims.
    - id: CASE.TREAT.02
      title: A contraindicated order is challenged rather than accepted silently
      kind: manual
      platforms: [any]
      severity_if_failed: major
      steps: |-
        1. Order a treatment the case marks as contraindicated (ask the case's author which one).
      expected: |-
        The order is accepted but a clearly visible warning explains the contraindication in clinical
        terms. It is not refused without explanation, and it is not accepted with no comment at all.
    - id: CASE.TREAT.03
      title: A treatment can be stopped
      kind: automated
      platforms: [any]
      severity_if_failed: minor
      steps: |-
        1. Administer a continuous infusion.
        2. Discontinue it from the treatments list.
        3. Watch the active-treatments panel.
      expected: |-
        The order is shown as discontinued and its contribution to the vital signs stops growing and
        then fades, rather than continuing as though it were still running.
      covers:
        - "rohy:chromium::gate-core.spec.js › orders honour what the learner asked for › a treatment can be discontinued, and the order says so afterwards"

- feature: MONITOR.VITALS
  title: The patient monitor
  products: [rohy]
  tier: core
  cases:
    - id: MONITOR.VITALS.01
      title: The monitor reads as a monitor
      kind: both
      platforms: [any]
      severity_if_failed: blocker
      steps: |-
        1. In the patient room, watch the monitor column for thirty seconds without touching it.
      expected: |-
        Three traces scroll steadily right to left (ECG, plethysmograph and respiration), the numeric
        boxes carry sensible clinical values with their units, and the digits drift slightly rather
        than standing perfectly still.
      covers: ["rohy:chromium::case-lifecycle.spec.js › case lifecycle › 3. vitals tick*"]
    - id: MONITOR.VITALS.02
      title: The session clock is the real elapsed time
      kind: automated
      platforms: [any]
      severity_if_failed: major
      steps: |-
        1. Note the "Session time" reading and the real time.
        2. Move to the Laboratory room, wait two minutes, and come back to the patient room.
      expected: |-
        The session clock reads about two minutes further on — it tracks elapsed time rather than
        restarting when the room is re-entered.
      covers:
        - "rohy:chromium::gate-rooms.spec.js › the session clock › the clock is real elapsed time, not a counter that starts at zero"

    - id: MONITOR.VITALS.03
      title: A rhythm change is visible in the trace, not only in the numbers
      kind: manual
      platforms: [any]
      severity_if_failed: major
      steps: |-
        1. As an admin, open the monitor's controls and set the rhythm to atrial fibrillation.
        2. Watch the ECG trace.
      expected: |-
        The trace itself changes shape — the beat-to-beat spacing becomes irregular — rather than only
        the heart-rate number changing.

- feature: MONITOR.PAUSE
  title: Pausing the simulation
  products: [rohy]
  tier: extended
  cases:
    - id: MONITOR.PAUSE.01
      title: Pause stops the case, not just the moving line
      kind: manual
      platforms: [any]
      severity_if_failed: major
      steps: |-
        1. Press the pause control on the monitor.
        2. Note the session clock and the vital-sign numbers, then wait a full minute.
        3. Switch to the Laboratory room and back to the patient room.
        4. Reload the page.
      expected: |-
        While paused the traces stop, the numbers hold still and the session clock does not advance;
        and the case is still paused after both the room change and the reload rather than quietly
        resuming.
    - id: MONITOR.PAUSE.02
      title: Resuming continues rather than restarting
      kind: manual
      platforms: [any]
      severity_if_failed: minor
      steps: |-
        1. From a paused case, press the control again to resume.
      expected: |-
        The traces and the clock carry on from where they stopped, and the paused minute is not
        counted as case time.

- feature: ALARM.BREACH
  title: Alarms
  products: [rohy]
  tier: core
  cases:
    - id: ALARM.BREACH.01
      title: A vital out of range raises an alarm the learner cannot miss
      kind: both
      platforms: [any]
      severity_if_failed: blocker
      steps: |-
        1. As an admin, drive one vital sign clearly outside its limits (for example SpO2 to 80%).
        2. Watch the patient room without interacting.
      expected: |-
        Within a few seconds an alarm appears on the monitor naming the vital and its severity, and
        the alarm button in the monitor header shows it is active.
      covers: ["rohy:chromium::alarms.spec.js › alarms + notifications (Phase 5) › breach + log*"]
    - id: ALARM.BREACH.02
      title: An alarm stays until it is acknowledged
      kind: manual
      platforms: [any]
      severity_if_failed: major
      steps: |-
        1. Raise an alarm, then bring the vital back into range without acknowledging it.
        2. Read the alarm list.
        3. Acknowledge it.
      expected: |-
        The alarm remains listed after the vital recovers — a transient breach is not erased — and it
        clears only once acknowledged.
    - id: ALARM.BREACH.03
      title: Acknowledging one alarm does not pre-silence the next
      kind: automated
      platforms: [any]
      severity_if_failed: major
      steps: |-
        1. Raise an alarm and acknowledge it.
        2. Raise a different alarm on another vital sign.
      expected: |-
        The second alarm announces itself fully — it does not arrive already acknowledged because of
        the first.
      covers: ["rohy:chromium::alarms.spec.js › alarms + notifications (Phase 5) › ack on one case does not pre-ack*"]
    - id: ALARM.BREACH.04
      title: Ending the case does not carry an alarm into the debrief
      kind: manual
      platforms: [any]
      severity_if_failed: minor
      steps: |-
        1. Leave an alarm sounding and unacknowledged.
        2. End the case with **End & Debrief**.
      expected: |-
        The debrief opens quietly; no alarm tone or alarm strip follows the learner out of the case.

- feature: SCENARIO.TIME
  title: The case evolving on its own
  products: [rohy]
  tier: core
  cases:
    - id: SCENARIO.TIME.01
      title: The patient deteriorates without the learner doing anything
      kind: both
      platforms: [any]
      severity_if_failed: major
      steps: |-
        1. Start a case whose scenario begins automatically (the STEMI case).
        2. Write down the vital signs.
        3. Wait two minutes without interacting, then read them again.
      expected: |-
        The vital signs have moved along a clinical trajectory rather than drifting randomly, and any
        threshold crossed on the way has raised its alarm.
      covers: ["rohy:chromium::scenario-engine.spec.js › scenario engine › *"]
    - id: SCENARIO.TIME.02
      title: Time passes even while the learner is in another room
      kind: automated
      platforms: [any]
      severity_if_failed: major
      steps: |-
        1. With a scenario running, note the vitals and go to the Radiology room.
        2. Stay there for two minutes, then return to the patient room.
      expected: |-
        The patient is where the trajectory should have carried them in those two minutes — the
        scenario does not pause or restart because nobody was watching.
      covers:
        - "rohy:chromium::gate-rooms.spec.js › the session clock › time passes even while the learner is in another room"

- feature: TEAM.CONSULT
  title: The care team
  products: [rohy]
  tier: extended
  cases:
    - id: TEAM.CONSULT.01
      title: A paged colleague arrives and answers as a colleague
      kind: manual
      platforms: [any]
      severity_if_failed: major
      steps: |-
        1. On a case with a supporting agent, open that agent's tab above the chat.
        2. Press the call button and wait.
        3. Ask them a clinical question about the patient.
      expected: |-
        The tab's status moves to indicate they are on their way and then that they have arrived, and
        the reply reads as a colleague speaking to a doctor — not as the patient and not as a
        narrator.

- feature: SESSION.END
  title: Ending a case
  products: [rohy]
  tier: core
  cases:
    - id: SESSION.END.01
      title: Ending the case closes it and opens the debrief
      kind: both
      platforms: [any]
      severity_if_failed: blocker
      steps: |-
        1. In a running case press **End & Debrief** and confirm.
        2. Once in the debrief, use **Back to patient**.
      expected: |-
        The debrief opens; back in the patient room the case is plainly over — the clock is frozen and
        marked as ended, the composer no longer accepts messages, and the end button is gone.
      covers: ["rohy:chromium::case-lifecycle.spec.js › case lifecycle › 6. end session*"]
    - id: SESSION.END.02
      title: Ending is deliberate
      kind: automated
      platforms: [any]
      severity_if_failed: major
      steps: |-
        1. Press **End & Debrief** and then dismiss the confirmation without confirming.
      expected: |-
        Nothing ends: the case is still running, and no debrief has been opened.
      covers:
        - "rohy:chromium::gate-rooms.spec.js › ending the case › ending is deliberate: dismissing the confirmation ends nothing"

- feature: DEBRIEF.REVIEW
  title: The debrief summary
  products: [rohy]
  tier: core
  cases:
    - id: DEBRIEF.REVIEW.01
      title: The case summary reflects what this learner actually did
      kind: automated
      platforms: [any]
      severity_if_failed: major
      steps: |-
        1. Run a case in which you order exactly one lab, perform exactly one examination and give
           exactly one treatment.
        2. End the case and open the patient summary from the debrief.
      expected: |-
        The summary lists that one lab, that one examination and that one treatment — no invented
        entries, and nothing the learner did left out.
      covers:
        - "rohy:chromium::gate-core.spec.js › the debrief tells the truth about the session › the record holds exactly what was done, with nothing invented"

    - id: DEBRIEF.REVIEW.02
      title: The answer key is not shown until the case is over
      kind: both
      platforms: [any]
      severity_if_failed: blocker
      steps: |-
        1. While the case is still running, reach the Consultant room from the room bar and open the
           patient summary.
        2. Look for the treatment debrief and anything headed "missed".
        3. End the case and open the same summary again.
      expected: |-
        Mid-case the missed-treatment section is withheld or marked pending; only after the case has
        ended does it list what was expected and missed.
      covers:
        - "rohy:chromium::clinical-guardrails.spec.js › clinical guardrails › the answer key is withheld while the case is live and released when it ends"

- feature: DEBRIEF.DISCUSS
  title: The discussant conversation
  products: [rohy]
  tier: core
  cases:
    - id: DEBRIEF.DISCUSS.01
      title: The discussant is a different person from the patient
      kind: both
      platforms: [any]
      severity_if_failed: major
      steps: |-
        1. End a case and press **Start debrief**.
        2. Say or type an answer to the discussant's opening question.
      expected: |-
        The discussant is named and titled as a tutor or colleague, speaks about the case in the
        third person, and — if voice is on — uses a different voice from the patient's.
      covers: ["rohy:chromium::case-lifecycle.spec.js › case lifecycle › 7. debrief discussant speaks*"]
    - id: DEBRIEF.DISCUSS.02
      title: The debrief asks rather than lectures
      kind: manual
      platforms: [any]
      severity_if_failed: minor
      steps: |-
        1. Work through three or four turns of a debrief, including one deliberately wrong answer.
      expected: |-
        The discussant probes the reasoning and corrects the wrong answer without either reciting the
        whole case solution unprompted or letting a clear error pass unchallenged.
    - id: DEBRIEF.DISCUSS.03
      title: A failed debrief turn says so and keeps the learner's words
      kind: manual
      platforms: [any]
      severity_if_failed: major
      steps: |-
        1. With the model provider unreachable, send a message in the debrief.
      expected: |-
        A visible message says the reply did not arrive and that the learner's message was not lost;
        the transcript keeps what they said and the debrief can be retried.
    - id: DEBRIEF.DISCUSS.04
      title: A case with no discussant says so plainly
      kind: both
      platforms: [any]
      severity_if_failed: minor
      steps: |-
        1. Open the debrief on a case that has no discussant attached.
      expected: |-
        A plain message explains that no discussant is configured and where an admin would add one.
        The room does not sit on an empty loading state or crash.
      covers:
        - "rohy:chromium::gate-core.spec.js › the debrief tells the truth about the session › a case with no discussant resolves to none rather than hanging"

- feature: DEBRIEF.RECORD
  title: The encounter record
  products: [rohy]
  tier: extended
  cases:
    - id: DEBRIEF.RECORD.01
      title: The learner's own action record is off unless the educator turned it on
      kind: manual
      platforms: [any]
      severity_if_failed: blocker
      steps: |-
        1. As a learner, end a case whose educator has NOT enabled the encounter record and look at
           the debrief's header controls.
        2. Have an educator enable the encounter record for that case.
        3. Run and end the case again as the learner.
      expected: |-
        In the first run there is no way for the learner to open their action record; in the second a
        control appears and opens a read-only list of what they did.

