- feature: AUTH.COOKIE
  title: The cookie session lane and CSRF
  products: [rohy]
  tier: core
  cases:
    - id: AUTH.COOKIE.01
      title: A cookie session works without a bearer header, and a write without the CSRF token is refused
      kind: automated
      platforms: [any]
      severity_if_failed: blocker
      steps: |-
        1. Sign in and inspect the cookies that come back.
        2. Make an authenticated read using only the cookie.
        3. Make a write with, and without, the `X-CSRF-Token` header.
        4. Sign out.
      expected: |-
        Sign-in sets an HttpOnly session cookie and a script-readable CSRF cookie; a cookie-only read
        succeeds; a write without the CSRF header is refused 403 while one with a matching header
        succeeds and rotates the session cookie; and signing out clears both cookies.
      covers:
        - "rohy:chromium::cookie-auth.spec.js › *"

- feature: AUTH.REGISTRATION
  title: Who may create an account
  products: [rohy]
  tier: core
  cases:
    - id: AUTH.REGISTRATION.01
      title: Registration is closed on a fresh install and cannot be used to self-elevate
      kind: automated
      platforms: [any]
      severity_if_failed: blocker
      steps: |-
        1. On a fresh install, try to register an account.
        2. With registration opened, try to register while asking for the admin role.
        3. Register normally with no role given.
      expected: |-
        A fresh install refuses registration; a request that asks for admin is refused 403; and an
        ordinary registration produces a usable student account. Self-service sign-up can never mint
        privilege.
      covers:
        - "rohy:chromium::auth.spec.js › auth › registration is closed by default on a fresh install"
        - "rohy:chromium::auth.spec.js › auth › open registration cannot self-elevate to admin (403)"
        - "rohy:chromium::auth.spec.js › auth › open registration without role defaults to student and returns a usable JWT"

- feature: RBAC.MATRIX
  title: What each role may reach
  products: [rohy]
  tier: core
  cases:
    - id: RBAC.MATRIX.01
      title: Every role is held to its own boundary
      kind: automated
      platforms: [any]
      severity_if_failed: blocker
      steps: |-
        1. As each of student, reviewer, educator and admin, call the endpoints that role should and
           should not reach.
        2. Try to raise your own role through a self-update.
        3. Try to create a user with an invented role.
      expected: |-
        Each role reaches exactly its own surface: a student cannot read the audit log or another
        user, a reviewer may read analytics but not author cases, an educator may author cases but
