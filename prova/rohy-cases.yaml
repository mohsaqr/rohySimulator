      kind: manual
      platforms: [any]
      severity_if_failed: major
      steps: |-
        1. Order a chest X-ray, then open the PACS room from the bar.
        2. Select the study in the worklist.
      expected: |-
        Either the images load and can be paged through, or the room states in plain language that
        there are no images for this study. It never shows an endless spinner, a blank pane or a raw
        error code.
      covers:
        - "rohy:chromium::plugin-rooms.spec.js › plugin content › an installed plugin serves its catalogue, or explains how to install it"
    - id: PLUGIN.PACS.02
      title: Images are withheld until the study has been reported
      kind: manual
      platforms: [any]
      severity_if_failed: minor
      steps: |-
        1. Order an imaging study WITHOUT using "Order instantly".
        2. Open PACS immediately and select that study.
      expected: |-
        While the turnaround is still running the study says the images have not been released yet,
        rather than showing them early.

- feature: PLUGIN.ECG
  title: The 12-lead ECG room
  products: [rohy]
  tier: extended
  cases:
    - id: PLUGIN.ECG.01
      title: An authored ECG opens and can be read
      kind: manual
      platforms: [any]
      severity_if_failed: major
      steps: |-
        1. Start a case that has an authored 12-lead ECG and open the ECG room.
        2. Read the trace and use whatever measurement or caliper tools the room offers.
      expected: |-
