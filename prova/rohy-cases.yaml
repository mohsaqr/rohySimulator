    - id: LAYOUT.TABLET.02
      title: The conversation and the monitor are both usable on a tablet
      kind: manual
      platforms: [any]
      severity_if_failed: major
      steps: |-
        1. In the patient room on a tablet, send a message and read the vital signs.
      expected: |-
        The composer and the vital signs are both usable without zooming, and the on-screen keyboard
        does not cover the message being typed.

- feature: A11Y.KEYBOARD
  title: Keyboard and labelling
  products: [rohy]
