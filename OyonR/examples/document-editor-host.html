<!doctype html>
<!--
  document-editor-host.html — a minimal host that is NOT a chat application:
  a plain document editor page that integrates Oyon in three calls.

      1. capture   createSignalCapture(...) + capture.typing.attach(editor)
      2. store     the host keeps the records Oyon emits (its own storage)
      3. view      <oyon-app scope="…">.setRecords(storedRecords)

  There is no camera, no model download and no Oyon backend on this page.
  The editor is a `contenteditable`; Oyon reads counts and positions from it,
  never the text.

  Serve the REPO ROOT so /src and /standalone/app/dist-element resolve
  (build the element first with `npm run app:build:element`):

      npm start
      open http://127.0.0.1:5173/examples/document-editor-host.html

  A host whose editor applies its own edits and fires no `input` event
  replaces step 1's attach() with capture.typing.report() and calls
  reportEdit() per edit — see docs/HOST_SCOPES.md.
-->
<html lang="en">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <title>Notebook — Oyon document-editor host</title>
    <style>
      html, body { height: 100%; margin: 0; }
      body {
        font-family: Georgia, 'Times New Roman', serif;
        background: #f7f4ee;
        color: #23201a;
      }
      /* The writing strip on top; the dashboard takes the rest of the page. */
      main {
        display: flex;
        flex-direction: column;
        gap: 10px;
        height: 100%;
        box-sizing: border-box;
        padding: 12px 16px 0;
      }
      h1 { margin: 0; font-size: 20px; }
      .bar { display: flex; flex-wrap: wrap; align-items: center; gap: 8px; font-size: 14px; }
      #editor {
        flex: 0 0 auto;
        min-height: 5rem;
        max-height: 22vh;
        overflow: auto;
        padding: 12px 14px;
        border: 1px solid #b9b0a0;
        border-radius: 6px;
        background: #fffdf8;
        font-size: 17px;
        line-height: 1.6;
      }
      #editor:focus { outline: 2px solid #0072b2; outline-offset: 2px; }
      button, select { font: inherit; padding: 4px 10px; }
      #status { color: #5c5547; }
      /* The embed takes the host's look through CSS custom properties. */
      oyon-app {
        display: block;
        flex: 1 1 auto;
        min-height: 0;
        margin: 0 -16px;
        border-top: 1px solid #b9b0a0;
        --oyon-surface: #fffdf8;
        --oyon-surface-raised: #f7f4ee;
        --oyon-text: #23201a;
        --oyon-border: #d8d0c0;
        --oyon-accent: #0072b2;
        --oyon-accent-dim: rgba(0, 114, 178, 0.14);
      }
    </style>
  </head>
  <body>
    <main>
      <div class="bar">
        <h1>Notebook</h1>
        <span id="status">Write below, then save the passage.</span>
      </div>

      <div id="editor" contenteditable="true" role="textbox" aria-multiline="true" aria-label="Document"></div>

      <div class="bar">
        <button id="save" type="button">Save passage</button>
        <label>
          View
          <select id="scope" aria-label="Analytics scope">
            <option value="session">this session</option>
            <option value="person" selected>this writer</option>
            <option value="group">the whole group</option>
          </select>
        </label>
        <span id="counts"></span>
      </div>

      <oyon-app
        id="viewer"
        chrome="none"
        scope="person"
        user-id="writer-1"
        user-label="Writer One"
        session-id="notebook-session-1"
        closable
      ></oyon-app>
    </main>

    <script type="module" src="/standalone/app/dist-element/oyon-app.element.js"></script>
    <script type="module">
      import { createSignalCapture } from '/src/core/SignalCapture.js';

      const editor = document.getElementById('editor');
      const viewer = document.getElementById('viewer');
      const status = document.getElementById('status');
      const counts = document.getElementById('counts');

      // 2. STORE — the host's own storage. An in-page object here; a real
      // host writes these records to its database and reads back only what
      // the current reader is allowed to see.
      const stored = { signalWindows: [], signalEvents: [] };

      // 1. CAPTURE — typing only; nothing else is constructed.
      const capture = createSignalCapture({
        settings: { typing_enabled: true },
        context: {
          session_id: 'notebook-session-1',
          user_id: 'writer-1',
          user_label: 'Writer One',
          group_id: 'seminar-a',
        },
        onWindow: (window) => stored.signalWindows.push(window),
        onEvent: (event) => stored.signalEvents.push(event),
      });
      capture.start();
      capture.typing.attach(editor, { targetId: 'notebook', contextId: 'document-1' });

      // 3. VIEW — hand the stored records to the embed. It draws exactly
      // these, filtered to its scope, and keeps no copy in browser storage.
      function show() {
        viewer.setRecords(stored);
      }

      document.getElementById('save').addEventListener('click', () => {
        capture.typing.submit();                       // closes the episode → onWindow
        capture.typing.attach(editor, { targetId: 'notebook', contextId: 'document-1' });
        show();
        status.textContent = 'Passage saved.';
      });

      document.getElementById('scope').addEventListener('change', (event) => {
        viewer.setAttribute('scope', event.target.value);
      });

      viewer.addEventListener('oyon:records', (event) => {
        const { accepted, refused } = event.detail;
        counts.textContent = `${accepted.total} records shown` + (refused.total ? `, ${refused.total} refused` : '');
      });
      viewer.addEventListener('oyon:close', () => {
        viewer.hidden = true;
        status.textContent = 'Analytics closed.';
      });

      // Exposed for the browser test (tests/e2e/host-scopes.spec.ts).
      window.__notebook = { capture, stored, show };
    </script>
  </body>
</html>
